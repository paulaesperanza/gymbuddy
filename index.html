  var firebaseConfig = {
    apiKey: "AIzaSyCmy5ZgqXUm_4XAMlN07b2KdZYmQahSe40",
    authDomain: "gymbuddy-bc8ad.firebaseapp.com",
    projectId: "gymbuddy-bc8ad",
    storageBucket: "gymbuddy-bc8ad.firebasestorage.app",
    messagingSenderId: "339237142494",
    appId: "1:339237142494:web:89bced987967419d49274f"
  };

  var FIRESTORE_FIELD_MAP = {
    "carga_logs_v1": "logs",
    "carga_custom_ex_v1": "customExercises",
    "carga_hidden_base_v1": "hiddenBase",
    "carga_ex_overrides_v1": "overrides",
    "carga_bodyweight_v1": "bodyweightLogs",
    "carga_calories_v1": "calorieLogs",
    "carga_cal_goal": "calorieGoal",
    "carga_theme": "theme",
    "carga_accent": "accent"
  };

  var fbApp = null, fbAuth = null, fbDb = null;
  var currentUser = null;
  var cloudReady = false;         // true cuando ya hemos cargado el primer snapshot del usuario
  var suppressNextSnapshot = false;
  var unsubscribeSnapshot = null;

  try{
    fbApp = firebase.initializeApp(firebaseConfig);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
  }catch(e){
    console.warn("Firebase no se pudo inicializar. Revisa firebaseConfig.", e);
  }

  function syncFieldToCloud(key, val){
    if(!currentUser || !fbDb || !cloudReady) return;
    var field = FIRESTORE_FIELD_MAP[key];
    if(!field) return;
    var update = {};
    update[field] = val;
    fbDb.collection("users").doc(currentUser.uid).set(update, { merge: true })
      .catch(function(err){ console.warn("No se pudo sincronizar con la nube:", err); });
  }

  // ---------- Migración inversa (una sola vez): si este navegador o esta cuenta llegó a tener
  // datos separados bajo "_alex" (de una versión anterior con conmutador de perfil), los
  // recupera y los fusiona de vuelta en los datos normales de esta cuenta. Cada persona tiene
  // su propia cuenta de Firebase, así que esa separación por perfil ya no hace falta.
  function runAlexMergeBackMigration(cloudData){
    var already = null;
    try{ already = localStorage.getItem("carga_alex_merge_back_v1"); }catch(e){}
    if(already === "1") return false;

    function pick(baseKey){
      var cloudField = FIRESTORE_FIELD_MAP[baseKey] ? FIRESTORE_FIELD_MAP[baseKey] + "_alex" : null;
      if(cloudData && cloudField && cloudData[cloudField] !== undefined) return cloudData[cloudField];
      return loadJSON(baseKey + "_alex", null);
    }

    var alexLogs = pick("carga_logs_v1");
    var alexCustom = pick("carga_custom_ex_v1");
    var alexHidden = pick("carga_hidden_base_v1");
    var alexOverrides = pick("carga_ex_overrides_v1");
    var alexBodyweight = pick("carga_bodyweight_v1");
    var alexCalorieLogs = pick("carga_calories_v1");
    var alexCalorieGoal = pick("carga_cal_goal");

    var hadAnything = alexLogs || alexCustom || alexHidden || alexOverrides ||
      (alexBodyweight && alexBodyweight.length) || (alexCalorieLogs && alexCalorieLogs.length) || alexCalorieGoal;
    if(!hadAnything){
      try{ localStorage.setItem("carga_alex_merge_back_v1", "1"); }catch(e){}
      return false;
    }

    if(alexLogs) logs = Object.assign({}, alexLogs, logs);
    if(alexCustom) customExercises = Object.assign({}, alexCustom, customExercises);
    if(alexHidden) hiddenBase = Object.assign({}, alexHidden, hiddenBase);
    if(alexOverrides) overrides = Object.assign({}, alexOverrides, overrides);
    if(alexBodyweight && alexBodyweight.length){
      var existingDates = {};
      bodyweightLogs.forEach(function(e){ existingDates[e.date] = true; });
      alexBodyweight.forEach(function(e){ if(!existingDates[e.date]) bodyweightLogs.push(e); });
      bodyweightLogs.sort(function(a,b){ return a.date.localeCompare(b.date); });
    }
    if(alexCalorieLogs && alexCalorieLogs.length){
      var existingCalDates = {};
      calorieLogs.forEach(function(e){ existingCalDates[e.date] = true; });
      alexCalorieLogs.forEach(function(e){ if(!existingCalDates[e.date]) calorieLogs.push(e); });
    }
    if(alexCalorieGoal) calorieGoal = parseInt(alexCalorieGoal, 10) || calorieGoal;

    saveJSON(STORAGE_KEY, logs);
    saveJSON(CUSTOM_KEY, customExercises);
    saveJSON(HIDDEN_KEY, hiddenBase);
    saveJSON(OVERRIDES_KEY, overrides);
    saveJSON(BODYWEIGHT_KEY, bodyweightLogs);
    saveJSON(CALORIE_KEY, calorieLogs);
    try{ localStorage.setItem(CAL_GOAL_KEY, String(calorieGoal)); }catch(e){}
    syncFieldToCloud(CAL_GOAL_KEY, calorieGoal);

    try{ localStorage.setItem("carga_alex_merge_back_v1", "1"); }catch(e){}
    if(currentUser && fbDb && cloudReady){
      fbDb.collection("users").doc(currentUser.uid).set({ alexMergedBack: true }, { merge: true })
        .catch(function(err){ console.warn("No se pudo marcar la fusión en la nube:", err); });
    }
    return true;
  }

  // Ajusta qué categorías se muestran según la cuenta que ha iniciado sesión.
  function applyAccountDayOrder(){
    var email = currentUser && currentUser.email ? currentUser.email.toLowerCase() : null;
    var base = (email && ACCOUNT_DAY_ORDER[email]) || FULL_DAY_ORDER;
    DAY_ORDER = withCustomDayOrder(base);
    if(DAY_ORDER.indexOf(activeDay) === -1) activeDay = DAY_ORDER[0];
    currentProgId = null; // el ejercicio seleccionado en Progreso podría no pertenecer a esta cuenta
  }

  function renderAll(){
    renderGreetingBlock();
    renderDayPills();
    renderExercises();
    var activeBtn = document.querySelector(".bn-item.active");
    var visibleView = activeBtn ? activeBtn.dataset.view : "hoy";
    if(visibleView === "progreso") renderProgress();
    if(visibleView === "historial") renderHistory();
  }

  function applyCloudData(data){
    logs = data.logs || {};
    customExercises = data.customExercises || {};
    hiddenBase = data.hiddenBase || {};
    overrides = data.overrides || {};
    bodyweightLogs = data.bodyweightLogs || [];
    calorieLogs = data.calorieLogs || [];
    if(data.calorieGoal) calorieGoal = data.calorieGoal;
    cacheLocally(STORAGE_KEY, logs);
    cacheLocally(CUSTOM_KEY, customExercises);
    cacheLocally(HIDDEN_KEY, hiddenBase);
    cacheLocally(OVERRIDES_KEY, overrides);
    cacheLocally(BODYWEIGHT_KEY, bodyweightLogs);
    cacheLocally(CALORIE_KEY, calorieLogs);
    if(data.calorieGoal){ try{ localStorage.setItem(CAL_GOAL_KEY, String(data.calorieGoal)); }catch(e){} }
    if(data.theme){ try{ localStorage.setItem(THEME_KEY, data.theme); }catch(e){} applyTheme(data.theme); }
    if(data.accent){ try{ localStorage.setItem(ACCENT_KEY, data.accent); }catch(e){} chooseAccentSilent(data.accent); }
    // Si la nube ya sabe que el historial de "_alex" se fusionó de vuelta (desde otro dispositivo),
    // lo recordamos también aquí para no repetir la fusión.
    if(data.alexMergedBack){ try{ localStorage.setItem("carga_alex_merge_back_v1", "1"); }catch(e){} }
    migrateLogsToCanonicalIds();

    renderAll();
  }

  // Igual que chooseAccent pero sin volver a guardar/sincronizar (para aplicar lo que llega de la nube)
  function chooseAccentSilent(hex){
    applyAccent(hex);
    renderAccentSwatches(hex);
    var customInput = document.getElementById("accentCustomInput");
    if(customInput) customInput.value = hex;
  }

  function startCloudSync(uid){
    cloudReady = false;
    if(unsubscribeSnapshot) unsubscribeSnapshot();
    var docRef = fbDb.collection("users").doc(uid);
    docRef.get().then(function(doc){
      // Activamos cloudReady ya aquí (en vez de al final) para que, si toca fusionar de vuelta
      // el historial "_alex" heredado, el guardado normal (saveJSON) lo suba también a la nube
      // en el mismo paso, sin duplicar lógica de sincronización.
      cloudReady = true;
      if(doc.exists){
        applyCloudData(doc.data());
        if(runAlexMergeBackMigration(doc.data())) renderAll();
      } else {
        // Primera vez de esta cuenta: fusionamos primero cualquier resto de "_alex" que
        // hubiera en este navegador y subimos lo que ya hubiera como punto de partida
        runAlexMergeBackMigration();
        var initData = {
          logs: logs,
          customExercises: customExercises,
          hiddenBase: hiddenBase,
          overrides: overrides,
          bodyweightLogs: bodyweightLogs,
          calorieLogs: calorieLogs,
          calorieGoal: calorieGoal
        };
        docRef.set(initData, { merge: true });
        renderAll();
      }
      updateSyncStatus();
      // Ya tenemos los datos reales de la cuenta (nombre, pestañas de día, historial):
      // ahora sí podemos quitar la pantalla de carga sin que se note ningún cambio.
      authLoading.classList.add("hidden");
      unsubscribeSnapshot = docRef.onSnapshot(function(doc){
        if(doc.exists && doc.metadata.hasPendingWrites === false){
          applyCloudData(doc.data());
        }
      });
    }).catch(function(err){
      console.warn("No se pudo cargar de la nube:", err);
      cloudReady = true; // seguimos funcionando en local aunque falle la nube
      updateSyncStatus();
      runAlexMergeBackMigration();
      renderAll();
      authLoading.classList.add("hidden");
    });
  }

  // ---------- Pantalla de inicio de sesión ----------
  var authGate = document.getElementById("authGate");
  var mainApp = document.getElementById("mainApp");
  var bottomNav = document.getElementById("bottomNav");
  var authEmail = document.getElementById("authEmail");
  var authName = document.getElementById("authName");
  var authNameGroup = document.getElementById("authNameGroup");
  var authPassword = document.getElementById("authPassword");
  var authError = document.getElementById("authError");
  var authStatus = document.getElementById("authStatus");
  var authSubmitBtn = document.getElementById("authSubmitBtn");
  var authTabLogin = document.getElementById("authTabLogin");
  var authTabSignup = document.getElementById("authTabSignup");
  var authBottomLink = document.getElementById("authBottomLink");
  var authForgotBtn = document.getElementById("authForgotBtn");
  var authModeSub = document.getElementById("authModeSub");
  var authHeading = document.getElementById("authHeading");
  var authEyeBtn = document.getElementById("authEyeBtn");
  var authEyeIcon = document.getElementById("authEyeIcon");
  var authMode = "login"; // o "signup"

  var EYE_OPEN = '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
  var EYE_OFF = '<path d="M2 2l20 20"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 11 7 11 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.16 13.16 0 0 0 1 12s4 7 11 7a10.44 10.44 0 0 0 5-1.19"/>';

  function showAuthError(msg){
    authError.textContent = msg;
    authError.style.display = "block";
  }
  function clearAuthError(){ authError.style.display = "none"; }

  function setAuthMode(mode){
    authMode = mode;
    clearAuthError();
    if(mode === "signup"){
      authTabSignup.classList.add("active");
      authTabLogin.classList.remove("active");
      authSubmitBtn.textContent = "Crear cuenta";
      authHeading.textContent = "Crea tu cuenta";
      authModeSub.textContent = "Guarda tus datos en la nube y sincronízalos entre dispositivos.";
      authNameGroup.style.display = "block";
      authBottomLink.innerHTML = '¿Ya tienes cuenta? <a id="authToggleModeBtn">Inicia sesión</a>';
    } else {
      authTabLogin.classList.add("active");
      authTabSignup.classList.remove("active");
      authSubmitBtn.textContent = "Entrar";
      authHeading.textContent = "Inicia sesión para continuar";
      authModeSub.textContent = "Accede a tu progreso y tus rutinas.";
      authNameGroup.style.display = "none";
      authBottomLink.innerHTML = '¿No tienes cuenta? <a id="authToggleModeBtn">Regístrate</a>';
    }
    // El enlace inferior se recrea cada vez, así que hay que volver a engancharle el evento
    document.getElementById("authToggleModeBtn").addEventListener("click", function(){
      setAuthMode(authMode === "login" ? "signup" : "login");
    });
  }

  authTabLogin.addEventListener("click", function(){ setAuthMode("login"); });
  authTabSignup.addEventListener("click", function(){ setAuthMode("signup"); });
  document.getElementById("authToggleModeBtn").addEventListener("click", function(){
    setAuthMode(authMode === "login" ? "signup" : "login");
  });

  authEyeBtn.addEventListener("click", function(){
    var isPassword = authPassword.type === "password";
    authPassword.type = isPassword ? "text" : "password";
    authEyeIcon.innerHTML = isPassword ? EYE_OFF : EYE_OPEN;
  });

  authForgotBtn.addEventListener("click", function(){
    clearAuthError();
    var email = authEmail.value.trim();
    if(!email){ showAuthError("Escribe primero tu email arriba."); return; }
    fbAuth.sendPasswordResetEmail(email)
      .then(function(){ authStatus.textContent = "Te hemos enviado un email para restablecer la contraseña."; })
      .catch(function(err){ showAuthError(traduceErrorFirebase(err)); });
  });

  authSubmitBtn.addEventListener("click", function(){
    clearAuthError();
    authStatus.textContent = "";
    var email = authEmail.value.trim();
    var password = authPassword.value;
    var name = authName.value.trim();
    if(!email || !password){ showAuthError("Rellena email y contraseña."); return; }
    if(authMode === "signup" && !name){ showAuthError("Escribe tu nombre."); return; }
    if(!fbAuth){ showAuthError("Firebase no está configurado todavía."); return; }

    authSubmitBtn.disabled = true;
    var action;
    if(authMode === "signup"){
      action = fbAuth.createUserWithEmailAndPassword(email, password).then(function(cred){
        return cred.user.updateProfile({ displayName: name }).then(function(){
          renderGreetingBlock(); // ya hay currentUser gracias a onAuthStateChanged
        });
      });
    } else {
      action = fbAuth.signInWithEmailAndPassword(email, password);
    }

    action.catch(function(err){ showAuthError(traduceErrorFirebase(err)); })
      .then(function(){ authSubmitBtn.disabled = false; });
  });

  function traduceErrorFirebase(err){
    var code = err && err.code;
    var map = {
      "auth/invalid-email": "Ese email no es válido.",
      "auth/user-not-found": "No existe ninguna cuenta con ese email.",
      "auth/wrong-password": "Contraseña incorrecta.",
      "auth/email-already-in-use": "Ya existe una cuenta con ese email. Prueba a iniciar sesión.",
      "auth/weak-password": "La contraseña debe tener al menos 6 caracteres.",
      "auth/invalid-credential": "Email o contraseña incorrectos.",
      "auth/network-request-failed": "Sin conexión a internet."
    };
    return (map[code]) || "Ha ocurrido un error. Inténtalo de nuevo.";
  }

  var authLoading = document.getElementById("authLoading");

  if(fbAuth){
    fbAuth.onAuthStateChanged(function(user){
      currentUser = user;
      if(user){
        // OJO: no ocultamos la pantalla de carga todavía. Si la escondemos aquí, la app
        // se ve un instante con los datos "genéricos" (pestañas de día por defecto, sin
        // el nombre de la persona) hasta que llega la respuesta de la nube unos cientos
        // de ms después — eso es justo el "lag"/parpadeo al reabrir la app. Se oculta más
        // abajo, en startCloudSync(), cuando ya tenemos los datos reales de la cuenta.
        authGate.classList.add("hidden");
        mainApp.style.display = "block";
        bottomNav.style.display = "flex";
        updateSyncStatus();
        applyAccountDayOrder();
        startCloudSync(user.uid);
        // Red de seguridad: si por lo que sea la nube tarda demasiado o se queda
        // colgada, no dejamos a la persona mirando el splash para siempre.
        setTimeout(function(){ authLoading.classList.add("hidden"); }, 4000);
      } else {
        authLoading.classList.add("hidden");
        cloudReady = false;
        if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
        authGate.classList.remove("hidden");
        mainApp.style.display = "none";
        bottomNav.style.display = "none";
        updateSyncStatus();
        applyAccountDayOrder();
        // Modo local (sin sesión iniciada): fusionamos igualmente cualquier resto de "_alex"
        if(runAlexMergeBackMigration()) renderAll();
      }
    });
  } else {
    // Si Firebase no está configurado, dejamos usar la app igualmente en modo solo-local
    authLoading.classList.add("hidden");
    authGate.classList.add("hidden");
    mainApp.style.display = "block";
    bottomNav.style.display = "flex";
    if(runAlexMergeBackMigration()) renderAll();
  }

  // ---------- Inicio ----------
  migrateLogsToCanonicalIds();
  renderGreetingBlock();
  renderDayPills();
  renderExercises();

})();
</script>
