  // ---------- Temporizador de descanso (barra global, basada en reloj real) ----------
  // Guardamos SIEMPRE el instante real en que debe terminar (endAt), nunca solo un
  // contador que se decrementa cada segundo: así, si se sale de la app (se bloquea el
  // móvil, cambias de app) y se vuelve más tarde, el tiempo restante se recalcula
  // contra el reloj y no se queda "pillado" donde se dejó.
  var REST_TIMER_KEY = "carga_rest_timer_v1";
  var restTimerState = null; // { exName, totalSec, endAt, pausedRemaining (si está en pausa) }
  var restTimerInterval = null;

  var restBarEl = document.getElementById("restBar");
  var restBarTimeEl = document.getElementById("restBarTime");
  var restBarNameEl = document.getElementById("restBarName");
  var restBarRingFg = document.getElementById("restBarRingFg");
  var restBarToggleBtn = document.getElementById("restBarToggle");
  var restBarToggleIcon = document.getElementById("restBarToggleIcon");
  var restBarToggleLabel = document.getElementById("restBarToggleLabel");
  var restBarCloseBtn = document.getElementById("restBarClose");
  var REST_RING_CIRC = 97.4;
  var PAUSE_ICON = '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>';
  var PLAY_ICON = '<path d="M7 4.5v15l13 -7.5z"></path>';

  function saveRestTimerState(){
    try{ localStorage.setItem(REST_TIMER_KEY, JSON.stringify(restTimerState)); }catch(e){}
  }
  function clearRestTimerState(){
    restTimerState = null;
    try{ localStorage.removeItem(REST_TIMER_KEY); }catch(e){}
  }

  function renderRestBarTick(){
    if(!restTimerState) return;
    var remaining;
    if(restTimerState.pausedRemaining != null){
      remaining = restTimerState.pausedRemaining;
    } else {
      remaining = Math.round((restTimerState.endAt - Date.now()) / 1000);
    }
    if(remaining <= 0){
      restBarTimeEl.textContent = "0:00";
      restBarRingFg.style.strokeDashoffset = 0;
      try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
      clearInterval(restTimerInterval);
      restTimerInterval = null;
      clearRestTimerState();
      setTimeout(function(){ restBarEl.classList.add("hidden"); }, 1200);
      return;
    }
    restBarTimeEl.textContent = fmtRest(remaining);
    var frac = Math.max(0, Math.min(1, remaining / restTimerState.totalSec));
    restBarRingFg.style.strokeDashoffset = String(REST_RING_CIRC * (1 - frac));
  }

  function startRestBarInterval(){
    if(restTimerInterval) clearInterval(restTimerInterval);
    restTimerInterval = setInterval(renderRestBarTick, 1000);
  }

  function startRestTimer(ex){
    var totalSec = Array.isArray(ex.rest) ? ex.rest[0] : ex.rest;
    restTimerState = {
      exName: ex.name,
      totalSec: totalSec,
      endAt: Date.now() + totalSec * 1000,
      pausedRemaining: null
    };
    saveRestTimerState();
    restBarNameEl.textContent = ex.name;
    restBarToggleIcon.innerHTML = PAUSE_ICON;
    restBarToggleBtn.title = "Pausar";
    restBarToggleLabel.textContent = "Pausar";
    restBarEl.classList.remove("hidden");
    renderRestBarTick();
    startRestBarInterval();
  }

  function toggleRestTimer(){
    if(!restTimerState) return;
    if(restTimerState.pausedRemaining != null){
      // Reanudar: recalculamos el instante final desde ahora.
      restTimerState.endAt = Date.now() + restTimerState.pausedRemaining * 1000;
      restTimerState.pausedRemaining = null;
      restBarToggleIcon.innerHTML = PAUSE_ICON;
      restBarToggleBtn.title = "Pausar";
      restBarToggleLabel.textContent = "Pausar";
      startRestBarInterval();
    } else {
      restTimerState.pausedRemaining = Math.max(0, Math.round((restTimerState.endAt - Date.now()) / 1000));
      restBarToggleIcon.innerHTML = PLAY_ICON;
      restBarToggleBtn.title = "Reanudar";
      restBarToggleLabel.textContent = "Iniciar";
      clearInterval(restTimerInterval);
      restTimerInterval = null;
    }
    saveRestTimerState();
  }

  function closeRestTimer(){
    clearInterval(restTimerInterval);
    restTimerInterval = null;
    clearRestTimerState();
    restBarEl.classList.add("hidden");
  }

  restBarToggleBtn.addEventListener("click", toggleRestTimer);
  restBarCloseBtn.addEventListener("click", closeRestTimer);

  // Al recuperar el foco (volver de otra app, desbloquear el móvil, cambiar de pestaña)
  // recalculamos de inmediato contra el reloj real, en vez de esperar al próximo tick.
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && restTimerState) renderRestBarTick();
  });
  window.addEventListener("focus", function(){
    if(restTimerState) renderRestBarTick();
  });

  // Al cargar la app, si había un descanso en marcha (por ejemplo se cerró del todo
  // la pestaña/app y se ha vuelto a abrir), lo recuperamos con el tiempo real restante.
  (function restoreRestTimer(){
    var saved = null;
    try{ saved = JSON.parse(localStorage.getItem(REST_TIMER_KEY) || "null"); }catch(e){}
    if(!saved) return;
    var remaining = saved.pausedRemaining != null
      ? saved.pausedRemaining
      : Math.round((saved.endAt - Date.now()) / 1000);
    if(remaining <= 0){ clearRestTimerState(); return; }
    restTimerState = saved;
    restBarNameEl.textContent = saved.exName || "";
    restBarEl.classList.remove("hidden");
    if(saved.pausedRemaining != null){
      restBarToggleIcon.innerHTML = PLAY_ICON;
      restBarToggleBtn.title = "Reanudar";
      restBarToggleLabel.textContent = "Iniciar";
      renderRestBarTick();
    } else {
      restBarToggleIcon.innerHTML = PAUSE_ICON;
      restBarToggleBtn.title = "Pausar";
      restBarToggleLabel.textContent = "Pausar";
      renderRestBarTick();
      startRestBarInterval();
    }
  })();

  // ---------- Renderizado de ejercicios ----------
  function getExState(ex){
    if(openPanels[ex.id]) return "active";
    return loggedToday(logKeyFor(ex)) ? "completed" : "pending";
  }

  // Estado real del ejercicio con independencia de si el panel está abierto o cerrado:
  // "completed" (ya guardado hoy), "inprogress" (hay un borrador de hoy con algo escrito) o "pending".
  function getExCardStatus(ex){
    if(loggedToday(logKeyFor(ex))) return "completed";
    var d = drafts[ex.id];
    var isTodayDraft = d && d.date === todayStr();
    var hasAny = isTodayDraft && d.sets && d.sets.some(function(s){
      return (s.weight !== "" && s.weight !== undefined && s.weight !== null) ||
             (s.reps !== "" && s.reps !== undefined && s.reps !== null);
    });
    return hasAny ? "inprogress" : "pending";
  }
  // Nº de series marcadas como "hechas" en el borrador de hoy, y la última de ellas.
  function draftDoneInfo(ex){
    var d = drafts[ex.id];
    var isTodayDraft = d && d.date === todayStr();
    if(!isTodayDraft || !d.sets) return { done: 0, last: null };
    var doneSets = d.sets.filter(function(s){ return s.done; });
    return { done: doneSets.length, last: doneSets.length ? doneSets[doneSets.length - 1] : null };
  }

  // Cabecera expandida (panel abierto): igual que antes — badges, nombre y rejilla de info.
  function buildExpandedHeadHtml(ex, hasDraft, completedSummary, prevTopSet, prBest, doneCount){
    return '<div class="ex-main">' +
        '<div class="ex-badges-row">' + groupBadgeHtml(ex.group) +

          '<div class="ex-info-pill"><span class="eip-icon record">' + TROPHY_ICON_SVG + '</span><span class="eip-text"><span class="eip-label">Récord (PR)</span><span class="eip-value">' + (prBest ? (prBest.weight + 'kg · ' + prBest.reps + ' reps') : '—') + '</span></span></div>' +
          '<div class="ex-info-pill"><span class="eip-icon last">' + HISTORY_ICON_SVG + '</span><span class="eip-text"><span class="eip-label">Última sesión</span><span class="eip-value">' + (prevTopSet ? (prevTopSet.weight + 'kg × ' + prevTopSet.reps) : '—') + '</span></span></div>' +
          '<div class="ex-info-pill"><span class="eip-icon rest">' + CLOCK_ICON_SVG + '</span><span class="eip-text"><span class="eip-label">Descanso ideal</span><span class="eip-value">' + formatRest(ex) + '</span></span></div>' +

  // Cabecera colapsada (panel cerrado): resumen compacto tipo "tarjeta de estado".
  function buildCollapsedHeadHtml(ex){
    var status = getExCardStatus(ex);
    var total = ex.sets || 0;
    var info = draftDoneInfo(ex);
    var todayLog = loggedToday(logKeyFor(ex));
    var prevTopSet = maxSetInSession(previousSession(logKeyFor(ex)));
    var prBest = bestSetFor(logKeyFor(ex));
    var restVal = Array.isArray(ex.rest) ? ex.rest[0] : ex.rest;

    var statusHtml, sideBtnHtml, metaLeft, metaMid, showProgress, doneCount, progressClass;

    if(status === "completed"){
      // "Completado" refleja lo realmente guardado hoy (puede diferir del nº de series
      // objetivo si se hicieron más o menos), así que el total a mostrar es ese, no el objetivo.
      var loggedCount = todayLog ? todayLog.sets.length : total;
      total = loggedCount || total;
      doneCount = loggedCount;
      var lastSet = todayLog && todayLog.sets.length ? todayLog.sets[todayLog.sets.length - 1] : null;
      statusHtml = '<span class="exh-status completed">' + CHECK_ICON_SVG + ' Completado</span>';
      sideBtnHtml = '<span class="exh-side-btn completed">' + CHECK_ICON_SVG + '</span>';
      metaLeft = lastSet ? (lastSet.weight + ' kg × ' + lastSet.reps + ' reps') : (total + '×' + ex.reps);
      metaMid = 'Serie ' + total + ' de ' + total;
      showProgress = true;
      progressClass = "completed";
    } else if(status === "inprogress"){
      doneCount = info.done;
      var serieNum = Math.min(total || 1, info.done + 1);
      statusHtml = '<span class="exh-status active">' + STATUS_DOT_SVG + ' En curso</span>';
      sideBtnHtml = '<span class="exh-side-btn active">' + PLAY_ICON_SVG + '</span>';
      metaLeft = info.last ? (info.last.weight + ' kg × ' + info.last.reps + ' reps') : (prevTopSet ? (prevTopSet.weight + ' kg × ' + prevTopSet.reps + ' reps') : (total + '×' + ex.reps));
      metaMid = 'Serie ' + serieNum + ' de ' + total;
      showProgress = true;
      progressClass = "active";
    } else {
      doneCount = 0;
      statusHtml = '<span class="exh-status pending">Pendiente</span>';
      sideBtnHtml = '<span class="exh-side-btn pending">' + CHEVRON_DOWN_ICON_SVG + '</span>';
      metaLeft = total + ' series × ' + ex.reps + ' reps';
      metaMid = prBest ? ('PR ' + prBest.weight + ' kg') : ('Descanso ' + restVal + 's');
      showProgress = false;
    }

    var pct = total > 0 ? Math.min(100, Math.round(doneCount / total * 100)) : 0;
    var rightCount = status === "pending" ? (doneCount + '/' + total + ' series') : (doneCount + '/' + total + ' completadas');

    return '<div class="ex-main">' +
        '<div class="exh-top-row">' + groupBadgeHtml(ex.group) + statusHtml + '</div>' +
        '<p class="exh-title">' + escapeHtml(ex.name) + '</p>' +
        '<div class="exh-meta-row">' +
          '<span class="exh-meta-left">' + escapeHtml(metaLeft) + '</span>' +
          '<span class="exh-meta-sep">•</span>' +
          '<span class="exh-meta-mid">' + escapeHtml(metaMid) + '</span>' +
          '<span class="exh-meta-right">' + rightCount + '</span>' +
        '</div>' +
        (showProgress ?
          '<div class="exh-progress-row">' +
            '<div class="exh-progress-track"><div class="exh-progress-fill ' + progressClass + '" style="width:' + pct + '%"></div></div>' +
            '<span class="exh-chevron">' + CHEVRON_DOWN_ICON_SVG + '</span>' +
          '</div>' : '') +
      '</div>' +
      '<div class="ex-side">' + sideBtnHtml + '</div>';
  }

  function renderSessionProgress(){
    var wrap = document.getElementById("sessionProgress");
    if(!wrap) return;
    var list = exercisesForDay(activeDay);
    var total = list.length;
    var done = list.filter(function(ex){ return loggedToday(logKeyFor(ex)); }).length;
    var complete = total > 0 && done === total;

    wrap.innerHTML =
      '<div class="session-banner' + (complete ? " complete" : "") + '">' +
        '<div class="sb-left">' +
          '<span class="sb-icon">👆</span>' +
          '<span class="sb-hint">Toca un ejercicio para registrar las series de hoy</span>' +
        '</div>' +
        (total > 0
          ? '<span class="sb-badge' + (complete ? " complete" : "") + '">' + done + '/' + total + ' ' + (complete ? "¡Completo!" : "Hecho") + '</span>'
          : "") +
      '</div>';
  }

  // Vista simplificada para rutinas de tipo "clase dirigida" (pilates, yoga, spinning…):
  // sin ejercicios ni series, solo un registro rápido de asistencia (duración + nota opcional).
  function renderClassDay(){
    exerciseListEl.innerHTML = "";
    var key = activeDay;
    var r = ROUTINE[key];
    var list = classLogsFor(key).slice().sort(function(a, b){ return b.date.localeCompare(a.date); });
    var todayEntry = list.filter(function(e){ return e.date === todayStr(); })[0];
    var lastEntry = list[0];
    var totalCount = list.length;

    var card = document.createElement("div");
    card.className = "card class-day-card";

    var summaryHtml =
      '<div class="class-day-head">' +
        '<div class="class-day-icon">' + CALENDAR_ICON_SVG + '</div>' +
        '<div>' +
          '<p class="class-day-title">' + escapeHtml(r.label) + '</p>' +
          '<p class="class-day-sub">' + (totalCount ? (totalCount + (totalCount === 1 ? ' clase registrada' : ' clases registradas')) : 'Aún no has registrado ninguna clase') + '</p>' +
        '</div>' +
      '</div>';

    var formHtml;
    if(todayEntry){
      formHtml =
        '<div class="class-day-done">' +
          '<span class="class-day-done-check">' + CHECK_ICON_SVG + ' Clase de hoy registrada</span>' +
          '<span class="class-day-done-meta">' + todayEntry.duration + ' min' + (todayEntry.note ? ' · ' + escapeHtml(todayEntry.note) : '') + '</span>' +
          '<button type="button" class="btn ghost class-day-undo">Deshacer</button>' +
        '</div>';
    } else {
      var lastDuration = lastEntry ? lastEntry.duration : 45;
      formHtml =
        '<div class="class-day-form">' +
          '<label class="field-group"><span class="field-label">Duración (min)</span>' +
            '<input type="number" inputmode="numeric" class="field-input class-duration-input" value="' + lastDuration + '"></label>' +
          '<label class="field-group"><span class="field-label">Notas (opcional)</span>' +
            '<input type="text" class="field-input class-note-input" placeholder="Ej: buena sesión, más peso en la máquina 3…"></label>' +
          '<button type="button" class="btn primary class-day-save">' + CHECK_ICON_SVG + ' Marcar clase como completada</button>' +
        '</div>';
    }

    card.innerHTML = summaryHtml + formHtml;
    exerciseListEl.appendChild(card);

    var saveBtn = card.querySelector(".class-day-save");
    if(saveBtn){
      saveBtn.addEventListener("click", function(){
        var durationVal = parseInt(card.querySelector(".class-duration-input").value, 10);
        if(isNaN(durationVal) || durationVal <= 0){ alert("Introduce una duración válida (minutos)."); return; }
        var noteVal = card.querySelector(".class-note-input").value.trim();
        logClassToday(key, durationVal, noteVal);
        renderClassDay();
        renderDayPills();
      });
    }
    var undoBtn = card.querySelector(".class-day-undo");
    if(undoBtn){
      undoBtn.addEventListener("click", function(){
        if(confirm("¿Deshacer el registro de la clase de hoy?")){
          deleteClassToday(key);
          renderClassDay();
          renderDayPills();
        }
      });
    }

    if(list.length){
      var histWrap = document.createElement("div");
      histWrap.className = "card class-day-history";
      histWrap.innerHTML = '<p class="class-day-history-title">Historial reciente</p>' +
        list.slice(0, 8).map(function(e){
          return '<div class="class-day-history-row">' +
            '<span class="cdh-date">' + formatShortDate(e.date) + '</span>' +
            '<span class="cdh-duration">' + e.duration + ' min</span>' +
            (e.note ? '<span class="cdh-note">' + escapeHtml(e.note) + '</span>' : '') +
          '</div>';
        }).join("");
      exerciseListEl.appendChild(histWrap);
    }
  }

  function renderExercises(){
    var addExBtnEl = document.getElementById("addExBtn");
    if(isClassDay(activeDay)){
      if(addExBtnEl) addExBtnEl.classList.add("hidden");
      document.getElementById("sessionProgress").innerHTML = "";
      document.getElementById("newExPanel").innerHTML = "";
      renderClassDay();
      return;
    }
    if(addExBtnEl) addExBtnEl.classList.remove("hidden");
    renderSessionProgress();
    exerciseListEl.innerHTML = "";
    var list = exercisesForDay(activeDay);
    var groupCounts = {};
    list.forEach(function(ex){
      var g = ex.group || "otros";
      groupCounts[g] = (groupCounts[g] || 0) + 1;
    });
    var lastGroup = null;
    list.forEach(function(ex){
      var thisGroup = ex.group || "otros";
      if(thisGroup !== lastGroup){
        lastGroup = thisGroup;
        var groupHead = document.createElement("div");
        groupHead.className = "ex-group-header";
        var gCount = groupCounts[thisGroup] || 0;
        groupHead.innerHTML =
          '<span class="ex-group-left"><span class="ex-group-bar"></span><span class="ex-group-label">' +
            (MUSCLE_GROUP_LABELS[thisGroup] || "Otros") + '</span></span>' +
          '<span class="ex-group-count">' + gCount + (gCount === 1 ? " ejercicio" : " ejercicios") + '</span>';
        exerciseListEl.appendChild(groupHead);
      }
      var card = document.createElement("div");
      var state = getExState(ex);
      var isOpen = !!openPanels[ex.id];
      var collapsedStatus = getExCardStatus(ex);
      var cardStatusClass = isOpen ? "active" : (collapsedStatus === "inprogress" ? "active" : collapsedStatus);
      card.className = "card ex-card-" + cardStatusClass;

      var today = todayStr();
      var draft = drafts[ex.id];
      var hasDraft = draft && draft.date === today &&
        (draft.sets.some(function(s){ return s.weight !== "" || s.reps !== ""; }) ||
         (draft.notes && draft.notes.trim() !== ""));

      var todayLog = loggedToday(logKeyFor(ex));
      var completedSummary = "";
      if(state === "completed" && todayLog){
        completedSummary = '<div class="ex-completed-summary">' +
          todayLog.sets.map(function(s){ return s.weight + "kg×" + s.reps; }).join(" · ") +
          '</div>';
      }

      var prev = previousSession(logKeyFor(ex));
      var prevTopSet = maxSetInSession(prev);
      var prBest = bestSetFor(logKeyFor(ex));
      var doneCount = (state === "completed" && todayLog) ? todayLog.sets.length : 0;

      var head = document.createElement("div");
      head.className = "ex-head";
      head.innerHTML = isOpen
        ? buildExpandedHeadHtml(ex, hasDraft, completedSummary, prevTopSet, prBest, doneCount)
        : buildCollapsedHeadHtml(ex);
      card.appendChild(head);

      var menu = document.createElement("div");
      menu.className = "ex-menu hidden";
      menu.innerHTML =
        '<button class="ex-menu-item edit">✎ Editar ejercicio</button>' +
        '<button class="ex-menu-item delete danger">🗑 Eliminar ejercicio</button>';
      card.appendChild(menu);

      var editPanel = document.createElement("div");
      editPanel.className = "log-panel";
      card.appendChild(editPanel);

      var kebabBtn = head.querySelector(".ex-menu-btn");
      if(kebabBtn){
        kebabBtn.addEventListener("click", function(ev){
          ev.stopPropagation();
          document.querySelectorAll(".ex-menu").forEach(function(m){ if(m !== menu) m.classList.add("hidden"); });
          menu.classList.toggle("hidden");
        });
      }
      menu.querySelector(".edit").addEventListener("click", function(ev){
        ev.stopPropagation();
        menu.classList.add("hidden");
        if(editPanel.classList.contains("open")){
          editPanel.classList.remove("open");
          editPanel.innerHTML = "";
          return;
        }
        // Cerramos el panel de registro de series si estaba abierto, para no amontonar
        openPanels[ex.id] = false;
        panel.classList.remove("open");
        head.innerHTML = buildCollapsedHeadHtml(ex);

        editPanel.classList.add("open", "pop");
        var restVal = Array.isArray(ex.rest) ? ex.rest[0] : ex.rest;
        var groupFieldHtml = "";
        if(ex.custom){
          var curGroup = ex.group || "otros";
          var groupOptionsEdit = MUSCLE_GROUP_ORDER.map(function(g){
            return '<option value="' + g + '"' + (g === curGroup ? " selected" : "") + '>' + MUSCLE_GROUP_LABELS[g] + '</option>';
          }).join("");
          groupFieldHtml =
            '<div class="field-group"><label class="field-label">Grupo muscular</label>' +
              '<select class="field-input edit-group">' + groupOptionsEdit + '</select></div>';
        }
        editPanel.innerHTML =
          '<div class="field-group"><label class="field-label">Nombre</label>' +
            '<input class="field-input edit-name" value="' + escapeHtml(ex.name) + '"></div>' +
          groupFieldHtml +
          '<div class="field-group"><label class="field-label">Series</label>' +
            '<input class="field-input edit-sets" type="number" inputmode="numeric" value="' + ex.sets + '"></div>' +
          '<div class="field-group"><label class="field-label">Repeticiones</label>' +
            '<input class="field-input edit-reps" value="' + escapeHtml(ex.reps) + '"></div>' +
          '<div class="field-group"><label class="field-label">Descanso (segundos)</label>' +
            '<input class="field-input edit-rest" type="number" inputmode="numeric" value="' + restVal + '"></div>' +
          '<div class="log-actions">' +
            '<button class="btn ghost edit-cancel">Cancelar</button>' +
            '<button class="btn primary edit-save">Guardar cambios</button>' +
          '</div>';

        editPanel.querySelector(".edit-cancel").addEventListener("click", function(){
          editPanel.classList.remove("open");
          editPanel.innerHTML = "";
        });
        editPanel.querySelector(".edit-save").addEventListener("click", function(){
          var newName = editPanel.querySelector(".edit-name").value.trim();
          var newSets = parseInt(editPanel.querySelector(".edit-sets").value, 10);
          var newReps = editPanel.querySelector(".edit-reps").value.trim();
          var newRest = parseInt(editPanel.querySelector(".edit-rest").value, 10);
          if(!newName){ alert("El nombre no puede estar vacío."); return; }
          if(isNaN(newSets) || newSets <= 0){ alert("Introduce un número de series válido."); return; }
          if(!newReps){ alert("Introduce las repeticiones."); return; }
          if(isNaN(newRest) || newRest <= 0){ alert("Introduce un descanso válido (segundos)."); return; }
          var updates = { name: newName, sets: newSets, reps: newReps, rest: newRest };
          var groupSelectEl = editPanel.querySelector(".edit-group");
          if(groupSelectEl) updates.group = groupSelectEl.value;
          updateExercise(activeDay, ex, updates);
          editPanel.classList.remove("open");
          editPanel.innerHTML = "";
          renderExercises();
        });
      });
      menu.querySelector(".delete").addEventListener("click", function(ev){
        ev.stopPropagation();
        menu.classList.add("hidden");
        if(confirm('¿Eliminar "' + ex.name + '" de este día? Podrás seguir viendo su historial pasado.')){
          deleteExercise(activeDay, ex);
          delete openPanels[ex.id];
          renderExercises();
        }
      });

      var panel = document.createElement("div");
      panel.className = "log-panel" + (openPanels[ex.id] ? " open pop" : "");
      card.appendChild(panel);

      head.addEventListener("click", function(e){
        if(e.target.closest(".ex-menu-btn")) return;
        openPanels[ex.id] = !openPanels[ex.id];
        renderExercises();
      });

      if(openPanels[ex.id]){
        buildLogForm(panel, ex);
      }

      exerciseListEl.appendChild(card);
    });
  }

  function buildLogForm(panel, ex){
    panel.innerHTML = "";
    var today = todayStr();

    var setsWrap = document.createElement("div");
    setsWrap.className = "sets-card";
    setsWrap.innerHTML =
      '<div class="sets-card-title">' +
        '<h4>Series de hoy</h4>' +
      '</div>' +
      '<div class="sets-header">' +
        '<span class="sh-num">Set</span>' +
        '<span class="sh-prev">Anterior</span>' +
        '<span class="sh-field">Kg</span>' +
        '<span class="sh-field">Reps</span>' +
        '<span class="sh-rm">Check</span>' +
      '</div>';
    panel.appendChild(setsWrap);

    var setRows = [];
    var notesInput;
    var logKey = logKeyFor(ex);
    var prev = previousSession(logKey);

    function updateSerieProgressLabel(){
      var label = panel.parentElement ? panel.parentElement.querySelector(".ex-serie-progress") : null;
      if(!label) return;
      var doneN = setRows.filter(function(row){ return row.classList.contains("done"); }).length;
      label.textContent = "Serie " + doneN + " de " + (ex.sets || setRows.length);
    }
    // Resalta en color de acento la próxima serie pendiente por rellenar (la primera
    // que no está marcada como hecha), para guiar visualmente por dónde continuar.
    function updateActiveRowHighlight(){
      var assigned = false;
      setRows.forEach(function(row){
        if(!assigned && !row.classList.contains("done")){
          row.classList.add("active");
          assigned = true;
        } else {
          row.classList.remove("active");
        }
      });
    }

    function saveDraft(){
      var sets = setRows.map(function(row){
        return { weight: row.querySelector(".w-input").value, reps: row.querySelector(".r-input").value, done: row.classList.contains("done") };
      });
      var notesVal = notesInput ? notesInput.value : "";
      var hasContent = sets.some(function(s){ return s.weight !== "" || s.reps !== ""; }) || notesVal.trim() !== "";
      if(hasContent){
        drafts[ex.id] = { date: today, sets: sets, notes: notesVal };
      } else {
        delete drafts[ex.id];
      }
      saveJSON(DRAFT_KEY, drafts);
    }

    function addSetRow(weight, reps, done){
      var idx = setRows.length;
      var row = document.createElement("div");
      row.className = "set-row" + (done ? " done" : "");
      var prevSet = prev && prev.sets[idx] ? prev.sets[idx] : null;
      row.innerHTML =
        '<span class="set-num-badge">' + (idx+1) + '</span>' +
        '<span class="set-prev">' + (prevSet ? (prevSet.weight + 'kg×' + prevSet.reps) : '—') + '</span>' +
        '<div class="set-row-inputs">' +
          '<div class="set-field">' +
            '<input type="text" inputmode="decimal" placeholder="' + (prevSet ? prevSet.weight : '0') + '" class="w-input" value="' + (weight!==undefined?weight:'') + '">' +
          '</div>' +
          '<div class="set-field">' +
            '<input type="number" inputmode="numeric" placeholder="' + (prevSet ? prevSet.reps : '0') + '" class="r-input" value="' + (reps!==undefined?reps:'') + '">' +
          '</div>' +
        '</div>' +
        '<button type="button" class="set-check" title="Marcar serie como hecha">' + CHECK_ICON_SVG + '</button>' +
        '<button class="rm" title="Eliminar serie">×</button>';

      var wInput = row.querySelector(".w-input");
      var rInput = row.querySelector(".r-input");
      bindDecimalInput(wInput);
      wInput.addEventListener("input", saveDraft);
      rInput.addEventListener("input", saveDraft);

      row.querySelector(".set-check").addEventListener("click", function(){
        row.classList.toggle("done");
        saveDraft();
        updateSerieProgressLabel();
        updateActiveRowHighlight();
      });

      row.querySelector(".rm").addEventListener("click", function(){
        setsWrap.removeChild(row);
        setRows = setRows.filter(function(r){ return r !== row; });
        renumber();
        saveDraft();
        updateSerieProgressLabel();
        updateActiveRowHighlight();
      });
      setRows.push(row);
      setsWrap.appendChild(row);
    }
    function renumber(){
      setRows.forEach(function(row, i){
        row.querySelector(".set-num-badge").textContent = (i + 1);
      });
    }

    // Restaurar borrador, o partir de una sesión ya guardada hoy, o defaults
    var draft = drafts[ex.id];
    var draftIsToday = draft && draft.date === today;
    var todayLog = loggedToday(logKey);
    if(draftIsToday && draft.sets && draft.sets.length){
      draft.sets.forEach(function(s){ addSetRow(s.weight, s.reps, !!s.done); });
    } else if(todayLog){
      todayLog.sets.forEach(function(s){ addSetRow(s.weight, s.reps, true); });
    } else {
      var targetSets = ex.sets || 3;
      for(var i=0;i<targetSets;i++){ addSetRow(); }
    }
    updateSerieProgressLabel();
    updateActiveRowHighlight();

    var notesWrap = document.createElement("div");
    notesWrap.className = "field-group";
    notesWrap.style.marginTop = "10px";
    var notesInitial = draftIsToday && draft.notes ? draft.notes : (todayLog && todayLog.notes ? todayLog.notes : "");
    notesWrap.innerHTML =
      '<label class="field-label">Comentarios de hoy (opcional)</label>' +
      '<textarea class="field-input notes-input" rows="2" placeholder="Ej. molestia en el hombro, subí peso fácil, técnica floja en la última serie…"></textarea>';
    panel.appendChild(notesWrap);
    notesInput = notesWrap.querySelector(".notes-input");
    notesInput.value = notesInitial;
    notesInput.addEventListener("input", saveDraft);

    var actions = document.createElement("div");
    actions.className = "log-actions-secondary";
    actions.innerHTML =
      '<button class="btn ghost" id="addSetBtn">+ Añadir serie</button>' +
      '<button class="btn ghost" id="restBtn">⏱ Descansar ' + formatRest(ex) + '</button>';
    panel.appendChild(actions);

    var primaryActions = document.createElement("div");
    primaryActions.className = "log-actions-primary";
    primaryActions.innerHTML = '<button class="btn primary" id="saveSetBtn">Guardar ejercicio</button>';
    panel.appendChild(primaryActions);

    panel.querySelector("#restBtn").addEventListener("click", function(){
      startRestTimer(ex);
    });

    var history = document.createElement("div");
    history.className = "history-list";
    var arr = logs[logKey] || [];
    if(arr.length > 0){
      var recent = arr.slice(-3).reverse();
      history.innerHTML = "<div class='hl-title'>Últimas sesiones</div>" +
        recent.map(function(s){
          var setsStr = s.sets.map(function(x){ return x.weight + "kg×" + x.reps; }).join(", ");
          var notesStr = s.notes ? ' <span class="notes-preview">"' + escapeHtml(s.notes) + '"</span>' : '';
          return "<div>" + s.date + " — " + setsStr + notesStr + "</div>";
        }).join("");
    }
    panel.appendChild(history);

    panel.querySelector("#addSetBtn").addEventListener("click", function(){
      addSetRow(); saveDraft(); updateSerieProgressLabel(); updateActiveRowHighlight();
    });

    panel.querySelector("#saveSetBtn").addEventListener("click", function(){
      var sets = [];
      setRows.forEach(function(row){
        var w = parseDecimal(row.querySelector(".w-input").value);
        var r = parseFloat(row.querySelector(".r-input").value);
        if(!isNaN(w) && !isNaN(r) && w > 0 && r > 0){
          sets.push({weight:w, reps:r});
        }
      });
      if(sets.length === 0){
        alert("Introduce al menos un peso y unas repeticiones válidas.");
        return;
      }
      var notesVal = notesInput.value.trim();
      if(!logs[logKey]) logs[logKey] = [];
      var existingIdx = logs[logKey].findIndex(function(s){ return s.date === today; });
      if(existingIdx >= 0) logs[logKey][existingIdx] = {date: today, sets: sets, notes: notesVal};
      else logs[logKey].push({date: today, sets: sets, notes: notesVal});
      saveJSON(STORAGE_KEY, logs);
      delete drafts[ex.id];
      saveJSON(DRAFT_KEY, drafts);
      openPanels[ex.id] = false;
      renderExercises();
      renderGreetingBlock();
    });
  }

  // ---------- Añadir ejercicio personalizado ----------

  // ---------- Peso corporal ----------
  var BODYWEIGHT_KEY = "carga_bodyweight_v1";
  var bodyweightLogs = loadJSON(BODYWEIGHT_KEY, []); // [{date, weight}]
  var bwChartInstance = null;

  function sortedBodyweight(){
    return bodyweightLogs.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  }
  function saveBodyweight(weight){
    var today = todayStr();
    var idx = bodyweightLogs.findIndex(function(e){ return e.date === today; });
    if(idx >= 0) bodyweightLogs[idx].weight = weight;
    else bodyweightLogs.push({date: today, weight: weight});
    saveJSON(BODYWEIGHT_KEY, bodyweightLogs);
  }
  function updateBodyweightEntry(date, weight){
    var idx = bodyweightLogs.findIndex(function(e){ return e.date === date; });
    if(idx >= 0){
      bodyweightLogs[idx].weight = weight;
      saveJSON(BODYWEIGHT_KEY, bodyweightLogs);
    }
  }
  function deleteBodyweightEntry(date){
    bodyweightLogs = bodyweightLogs.filter(function(e){ return e.date !== date; });
    saveJSON(BODYWEIGHT_KEY, bodyweightLogs);
  }
  function bodyweightBaseline(arr){
    if(arr.length < 2) return null;
    var earlier = arr.slice(0, arr.length - 1); // todo menos el último (más reciente)
    var weekAgo = new Date();
    weekAgo.setDate(weekAgo.getDate() - 7);
    var weekAgoStr = weekAgo.toISOString().slice(0,10);
    var candidates = earlier.filter(function(e){ return e.date <= weekAgoStr; });
    if(candidates.length) return { entry: candidates[candidates.length-1], label: "Últimos 7 días" };
    return { entry: earlier[0], label: "Desde el primer registro" };
  }

  function renderBodyweightCard(){
    var card = document.getElementById("bodyweightCard");
    var arr = sortedBodyweight();

    if(arr.length === 0){
      card.innerHTML =
        '<div class="chart-wrap">' +
          '<div class="bw-header-row">' +
            '<div><div class="kpi-label">Peso corporal</div><div class="kpi-value display">— <span class="kpi-unit">kg</span></div></div>' +
            '<button class="btn primary bw-add-btn" id="bwAddBtn">+ Registrar peso</button>' +
          '</div>' +
          '<div class="bw-empty-hint">Aún no has registrado tu peso. Anótalo cada cierto tiempo para ver la tendencia.</div>' +
          '<div id="bwFormWrap"></div>' +
        '</div>';
    } else {
      var latest = arr[arr.length - 1];
      var baseline = bodyweightBaseline(arr);
      var delta = baseline ? Math.round((latest.weight - baseline.entry.weight) * 10) / 10 : null;
      var badgeClass = delta === null ? "flat" : (delta > 0 ? "up" : (delta < 0 ? "down" : "flat"));
      var badgeText = delta === null ? "Primer registro" : ((delta > 0 ? "+" : "") + delta.toFixed(1) + " kg");

      card.innerHTML =
        '<div class="chart-wrap">' +
          '<div class="bw-header-row">' +
            '<div><div class="kpi-label">Peso corporal</div><div class="kpi-value display">' + latest.weight + ' <span class="kpi-unit">kg</span></div></div>' +
            '<button class="btn primary bw-add-btn" id="bwAddBtn">+ Registrar</button>' +
          '</div>' +
          '<div class="sub">' + (baseline ? baseline.label : "Última pesada: " + latest.date) + ' <span class="kpi-badge ' + badgeClass + '" style="margin-left:6px;">' + badgeText + '</span></div>' +
          (arr.length >= 2 ? '<canvas id="bwChart" height="180"></canvas>' : '<div class="bw-empty-hint">Registra al menos dos pesadas para ver la gráfica de evolución.</div>') +
          '<div id="bwFormWrap"></div>' +
          '<button class="bw-history-toggle" id="bwHistoryToggle" type="button">Ver / editar registros (' + arr.length + ')</button>' +
          '<div id="bwHistoryWrap"></div>' +
        '</div>';

      if(arr.length >= 2){
        var colors = getChartColors();
        var bwCtx = document.getElementById("bwChart").getContext("2d");
        var bwGradient = bwCtx.createLinearGradient(0,0,0,180);
        bwGradient.addColorStop(0, hexToRgba(colors.accent2, 0.35));
        bwGradient.addColorStop(1, hexToRgba(colors.accent2, 0));
        if(bwChartInstance) bwChartInstance.destroy();
        bwChartInstance = new Chart(bwCtx, {
          type: 'line',
          data: { labels: arr.map(function(e){ return e.date; }), datasets: [{
            data: arr.map(function(e){ return e.weight; }),
            borderColor: colors.accent2,
            backgroundColor: bwGradient,
            fill: true,
            tension: 0.35,
            pointRadius: 3,
            pointBackgroundColor: colors.accent2,
            pointBorderColor: 'transparent'
          }]},
          options: {
            responsive:true,
            plugins:{ legend:{ display:false } },
            scales:{
              x:{ ticks:{ color: colors.text, font:{size:10} }, grid:{ display:false } },
              y:{ ticks:{ color: colors.text, font:{size:10} }, grid:{ color: hexToRgba(colors.text, 0.1) }, beginAtZero:false }
            }
          }
        });
      }
    }

    document.getElementById("bwAddBtn").addEventListener("click", function(){
      var formWrap = document.getElementById("bwFormWrap");
      if(formWrap.innerHTML !== ""){ formWrap.innerHTML = ""; return; }
      var todayEntry = arr.filter(function(e){ return e.date === todayStr(); })[0];
      formWrap.innerHTML =
        '<div class="bw-form">' +
          '<div class="field-group"><label class="field-label">Peso de hoy (kg)</label>' +
            '<input class="field-input" id="bwInput" type="text" inputmode="decimal" placeholder="Ej. 77.5" value="' + (todayEntry ? todayEntry.weight : '') + '"></div>' +
          '<button class="btn primary" id="bwSaveBtn">Guardar</button>' +
        '</div>';
      bindDecimalInput(document.getElementById("bwInput"));
      document.getElementById("bwSaveBtn").addEventListener("click", function(){
        var v = parseDecimal(document.getElementById("bwInput").value);
        if(isNaN(v) || v <= 0){ alert("Introduce un peso válido."); return; }
        saveBodyweight(Math.round(v*10)/10);
        renderBodyweightCard();
      });
    });

    var historyToggle = document.getElementById("bwHistoryToggle");
    if(historyToggle){
      historyToggle.addEventListener("click", function(){
        var wrap = document.getElementById("bwHistoryWrap");
        if(wrap.innerHTML !== ""){ wrap.innerHTML = ""; return; }
        var rows = arr.slice().reverse().map(function(entry){
          return '<div class="bw-history-item" data-date="' + entry.date + '">' +
            '<span class="bw-history-date">' + entry.date + '</span>' +
            '<span class="bw-history-weight">' + entry.weight + ' kg</span>' +
            '<button class="bw-history-btn edit" title="Editar">✎</button>' +
            '<button class="bw-history-btn delete" title="Eliminar">🗑</button>' +
          '</div>';
        }).join('');
        wrap.innerHTML = '<div class="bw-history-list">' + rows + '</div>';

        wrap.querySelectorAll('.bw-history-item').forEach(function(row){
          var date = row.dataset.date;
          row.querySelector('.edit').addEventListener('click', function(){
            var current = bodyweightLogs.find(function(e){ return e.date === date; });
            row.innerHTML =
              '<span class="bw-history-date">' + date + '</span>' +
              '<input class="field-input bw-history-input" type="text" inputmode="decimal" value="' + (current ? current.weight : '') + '">' +
              '<button class="bw-history-btn save" title="Guardar">✔</button>' +
              '<button class="bw-history-btn cancel" title="Cancelar">✕</button>';
            bindDecimalInput(row.querySelector('.bw-history-input'));
            row.querySelector('.save').addEventListener('click', function(){
              var v = parseDecimal(row.querySelector('.bw-history-input').value);
              if(isNaN(v) || v <= 0){ alert("Introduce un peso válido."); return; }
              updateBodyweightEntry(date, Math.round(v*10)/10);
              renderBodyweightCard();
            });
            row.querySelector('.cancel').addEventListener('click', function(){
              renderBodyweightCard();
            });
          });
          row.querySelector('.delete').addEventListener('click', function(){
            if(confirm('¿Eliminar el registro del ' + date + '?')){
              deleteBodyweightEntry(date);
              renderBodyweightCard();
            }
          });
        });
      });
    }
  }

  // ---------- Progreso ----------
  var currentProgId = null;
  var weightChartInstance = null;
  var volumeChartInstance = null;

  function allExercisesFlat(){
    var flat = [];
    DAY_ORDER.forEach(function(dayKey){
      exercisesForDay(dayKey).forEach(function(ex){
        flat.push({id: logKeyFor(ex), name: ex.name, day: ROUTINE[dayKey].label, group: ex.group || "otros", dayKey: dayKey, custom: !!ex.custom});
      });
    });
    return flat;
  }

  function renderProgChips(){
    var btn = document.getElementById("progSelectBtn");
    var label = document.getElementById("progSelectLabel");
    var dayLabel = document.getElementById("progSelectDay");
    var panel = document.getElementById("progSelectPanel");

    var flat = allExercisesFlat();
    if(!currentProgId && flat.length) currentProgId = flat[0].id;
    var current = flat.filter(function(e){ return e.id === currentProgId; })[0];
    label.textContent = current ? current.name : "Selecciona un ejercicio";
    dayLabel.textContent = current ? current.day : "";

    // Construir el panel agrupado por día, una sola vez (se reutiliza al reabrir)
    panel.innerHTML = "";
    DAY_ORDER.forEach(function(dayKey){
      var exs = exercisesForDay(dayKey);
      if(exs.length === 0) return;
      var groupLabel = document.createElement("div");
      groupLabel.className = "prog-group-label";
      groupLabel.textContent = ROUTINE[dayKey].label;
      panel.appendChild(groupLabel);
      exs.forEach(function(ex){
        var opt = document.createElement("button");
        opt.type = "button";
        opt.className = "prog-option" + (logKeyFor(ex) === currentProgId ? " active" : "");
        opt.textContent = ex.name;
        opt.addEventListener("click", function(){
          currentProgId = logKeyFor(ex);
          panel.classList.add("hidden");
          btn.classList.remove("open");
          renderProgChips();
          renderProgressContent();
        });
        panel.appendChild(opt);
      });
    });

    if(!btn.dataset.wired){
      btn.dataset.wired = "1";
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        panel.classList.toggle("hidden");
        btn.classList.toggle("open");
      });
      document.addEventListener("click", function(e){
        if(!e.target.closest("#progSelect")){
          panel.classList.add("hidden");
          btn.classList.remove("open");
        }
      });
    }
  }

  // ---------- Calorías ----------
  var CALORIE_KEY = "carga_calories_v1";
  var CAL_GOAL_KEY = "carga_cal_goal";
  var calorieLogs = loadJSON(CALORIE_KEY, []); // [{date, food, exercise}]
  var calorieGoal = 2000;
  try{
    var storedGoal = localStorage.getItem(CAL_GOAL_KEY);
    if(storedGoal) calorieGoal = parseInt(storedGoal, 10) || 2000;
  }catch(e){}

  function todayCalorieEntry(){
    return calorieLogs.find(function(e){ return e.date === todayStr(); }) || null;
  }

  function saveCalorieGoal(val){
    calorieGoal = val;
    try{ localStorage.setItem(CAL_GOAL_KEY, String(val)); }catch(e){}
    syncFieldToCloud(CAL_GOAL_KEY, val);
  }

  function saveCalorieEntry(food, exercise){
    var today = todayStr();
    var idx = calorieLogs.findIndex(function(e){ return e.date === today; });
    var entry = { date: today, food: food, exercise: exercise };
    if(idx >= 0) calorieLogs[idx] = entry;
    else calorieLogs.push(entry);
    saveJSON(CALORIE_KEY, calorieLogs);
  }

  function renderCalorieCard(){
    var card = document.getElementById("calorieCard");
    var today = todayCalorieEntry();
    var food = today ? today.food : 0;
    var exercise = today ? today.exercise : 0;
    var remaining = calorieGoal - food + exercise;
    var pct = calorieGoal > 0 ? Math.max(0, Math.min(1, remaining / calorieGoal)) : 0;

    var r = 50, circumference = 2 * Math.PI * r;
    var offset = circumference * (1 - pct);

    card.innerHTML =
      '<div class="chart-wrap">' +
        '<div class="cal-header">' +
          '<div><div class="kpi-label">Calorías de hoy</div><div class="kpi-value display">' + remaining + ' <span class="kpi-unit">kcal restantes</span></div></div>' +
          '<button class="btn ghost cal-goal-btn" id="calGoalBtn">🎯 Mi objetivo: ' + calorieGoal + '</button>' +
        '</div>' +
        '<div id="calGoalFormWrap"></div>' +
        '<div class="cal-ring-row">' +
          '<div class="cal-ring-wrap">' +
            '<svg class="cal-ring" viewBox="0 0 120 120">' +
              '<circle class="cal-ring-bg" cx="60" cy="60" r="' + r + '" stroke-width="10" fill="none"/>' +
              '<circle class="cal-ring-fg" cx="60" cy="60" r="' + r + '" stroke-width="10" fill="none" ' +
                'stroke-dasharray="' + circumference + '" stroke-dashoffset="' + offset + '" transform="rotate(-90 60 60)"/>' +
            '</svg>' +
            '<div class="cal-ring-center"><div class="num display">' + remaining + '</div><div class="lbl">restantes</div></div>' +
          '</div>' +
          '<div class="cal-breakdown">' +
            '<div class="cal-row"><span>Objetivo</span><b>' + calorieGoal + '</b></div>' +
            '<div class="cal-row"><span>Comida</span><b>' + food + '</b></div>' +
            '<div class="cal-row exercise"><span>Ejercicio</span><b>+' + exercise + '</b></div>' +
          '</div>' +
        '</div>' +
        '<button class="btn primary" id="calAddBtn" style="width:100%;justify-content:center;">+ Registrar calorías de hoy</button>' +
        '<div id="calFormWrap"></div>' +
      '</div>';

    document.getElementById("calGoalBtn").addEventListener("click", function(){
      var goalFormWrap = document.getElementById("calGoalFormWrap");
      if(goalFormWrap.innerHTML !== ""){ goalFormWrap.innerHTML = ""; return; }
      goalFormWrap.innerHTML =
        '<div class="cal-form">' +
          '<div class="field-group"><label class="field-label">Mi objetivo (kcal)</label>' +
            '<input class="field-input" id="calGoalInput" type="number" inputmode="numeric" value="' + calorieGoal + '"></div>' +
          '<button class="btn primary" id="calGoalSaveBtn" style="flex:0 0 auto;align-self:flex-end;">Guardar</button>' +
        '</div>';
      document.getElementById("calGoalSaveBtn").addEventListener("click", function(){
        var num = parseInt(document.getElementById("calGoalInput").value, 10);
        if(!isNaN(num) && num > 0){
          saveCalorieGoal(num);
          renderCalorieCard();
        }
      });
    });

    document.getElementById("calAddBtn").addEventListener("click", function(){
      var formWrap = document.getElementById("calFormWrap");
      if(formWrap.innerHTML !== ""){ formWrap.innerHTML = ""; return; }
      formWrap.innerHTML =
        '<div class="cal-form">' +
          '<div class="field-group"><label class="field-label">Comida (kcal)</label>' +
            '<input class="field-input" id="calFoodInput" type="number" inputmode="numeric" value="' + food + '"></div>' +
          '<div class="field-group"><label class="field-label">Ejercicio (kcal)</label>' +
            '<input class="field-input" id="calExInput" type="number" inputmode="numeric" value="' + exercise + '"></div>' +
          '<button class="btn primary" id="calSaveBtn" style="flex:0 0 auto;align-self:flex-end;">Guardar</button>' +
        '</div>';
      document.getElementById("calSaveBtn").addEventListener("click", function(){
        var f = parseInt(document.getElementById("calFoodInput").value, 10) || 0;
        var e = parseInt(document.getElementById("calExInput").value, 10) || 0;
        saveCalorieEntry(f, e);
        renderCalorieCard();
      });

  function getChartColors(){
    var styles = getComputedStyle(document.documentElement);
    return {
      accent: styles.getPropertyValue('--accent').trim() || '#C6FF3D',
      accent2: styles.getPropertyValue('--accent-2').trim() || '#22D3EE',
      text: styles.getPropertyValue('--text-dim').trim() || '#8A8F9A'
    };
  }

  function renderProgress(){
    renderBodyweightCard();
    renderCalorieCard();
    renderProgChips();
    renderProgressContent();
  }

  function renderProgressContent(){
    var content = document.getElementById("progContent");
    var exId = currentProgId;
    var arr = (logs[exId] || []).slice().sort(function(a,b){ return a.date.localeCompare(b.date); });

    if(arr.length === 0){
      content.innerHTML = '<div class="empty"><div class="big">📈</div>Todavía no hay registros para este ejercicio.<br>Ve a "Entreno" y registra tu primera sesión.</div>';
      if(weightChartInstance){ weightChartInstance.destroy(); weightChartInstance = null; }
      if(volumeChartInstance){ volumeChartInstance.destroy(); volumeChartInstance = null; }
      return;
    }

    var labels = arr.map(function(s){ return s.date; });
    var maxWeights = arr.map(function(s){ return maxWeightInSession(s); });
    var volumes = arr.map(function(s){
      return s.sets.reduce(function(sum,x){ return sum + x.weight * x.reps; }, 0);
    });

    var bestWeight = Math.max.apply(null, maxWeights);
    var weightDelta = maxWeights[maxWeights.length - 1] - maxWeights[0];
    var lastVolume = volumes[volumes.length - 1];
    var prevVolume = volumes.length > 1 ? volumes[volumes.length - 2] : null;
    var volumeDelta = prevVolume !== null ? lastVolume - prevVolume : null;

    function badgeClass(delta){ if(delta > 0) return "up"; if(delta < 0) return "down"; return "flat"; }
    function badgeText(delta, unit){
      if(delta === null) return "Primera sesión";
      var sign = delta > 0 ? "+" : "";
      return sign + delta.toFixed(1) + " " + unit;
    }

    content.innerHTML =
      '<div class="chart-wrap">' +
        '<div class="kpi-row">' +
          '<div><div class="kpi-label">PR actual</div><div class="kpi-value display">' + bestWeight + ' <span class="kpi-unit">kg</span></div></div>' +
          '<div class="kpi-badge ' + badgeClass(weightDelta) + '">' + badgeText(weightDelta, "kg") + '</div>' +
        '</div>' +
        '<div class="sub">Peso máximo por sesión</div>' +
        '<canvas id="weightChart" height="200"></canvas>' +
      '</div>' +
      '<div class="chart-wrap">' +
        '<div class="kpi-row">' +
          '<div><div class="kpi-label">Volumen última sesión</div><div class="kpi-value display">' + Math.round(lastVolume) + ' <span class="kpi-unit">kg</span></div></div>' +
          '<div class="kpi-badge ' + badgeClass(volumeDelta || 0) + '">' + badgeText(volumeDelta, "kg") + '</div>' +
        '</div>' +
        '<div class="sub">Peso × repeticiones de todas las series</div>' +
        '<canvas id="volumeChart" height="200"></canvas>' +
      '</div>';

    var colors = getChartColors();

    var wCtx = document.getElementById("weightChart").getContext("2d");
    var wGradient = wCtx.createLinearGradient(0,0,0,200);
    wGradient.addColorStop(0, hexToRgba(colors.accent, 0.35));
    wGradient.addColorStop(1, hexToRgba(colors.accent, 0));
    if(weightChartInstance) weightChartInstance.destroy();
    weightChartInstance = new Chart(wCtx, {
      type: 'line',
      data: { labels: labels, datasets: [{
        data: maxWeights,
        borderColor: colors.accent,
        backgroundColor: wGradient,
        fill: true,
        tension: 0.35,
        pointRadius: 3,
        pointBackgroundColor: colors.accent,
        pointBorderColor: 'transparent'
      }]},
      options: {
        responsive:true,
        plugins:{ legend:{ display:false } },
        scales:{
          x:{ ticks:{ color: colors.text, font:{size:10} }, grid:{ display:false } },
          y:{ ticks:{ color: colors.text, font:{size:10} }, grid:{ color: hexToRgba(colors.text, 0.1) }, beginAtZero:false }
        }
      }
    });

    var vCtx = document.getElementById("volumeChart").getContext("2d");
    var vGradient = vCtx.createLinearGradient(0,0,0,200);
    vGradient.addColorStop(0, hexToRgba(colors.accent2, 0.35));
    vGradient.addColorStop(1, hexToRgba(colors.accent2, 0));
    if(volumeChartInstance) volumeChartInstance.destroy();
    volumeChartInstance = new Chart(vCtx, {
      type: 'line',
      data: { labels: labels, datasets: [{
        data: volumes,
        borderColor: colors.accent2,
        backgroundColor: vGradient,
        fill: true,
        tension: 0.35,
        pointRadius: 3,
        pointBackgroundColor: colors.accent2,
        pointBorderColor: 'transparent'
      }]},
      options: {
        responsive:true,
        plugins:{ legend:{ display:false } },
        scales:{
          x:{ ticks:{ color: colors.text, font:{size:10} }, grid:{ display:false } },
          y:{ ticks:{ color: colors.text, font:{size:10} }, grid:{ color: hexToRgba(colors.text, 0.1) }, beginAtZero:true }
        }
      }
    });
  }

  // ---------- Historial ----------
  // ---------- Calendario de historial ----------
  var historyCalRef = new Date(); // día ancla: define el mes o la semana visible
  var historyFilterDate = null;
  var historyCalExpanded = false; // false = solo semana actual (plegado), true = mes completo

  function dateKey(y, m, d){ return y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0"); }
  function mondayOf(date){
    var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    var offset = (d.getDay() + 6) % 7; // lunes=0
    d.setDate(d.getDate() - offset);
    return d;
  }

  function renderHistoryCalendar(){
    var wrap = document.getElementById("historyCalendar");
    if(!wrap) return;
    var todayStrVal = todayStr();
    var cells = "";
    var titleLabel;
    var weekNumLabel = "";

    var WD_LETTERS = ["D","L","M","X","J","V","S"]; // getDay(): 0=domingo

    function dayCellHtml(dateObj, showWd){
      var y = dateObj.getFullYear(), m = dateObj.getMonth(), d = dateObj.getDate();
      var dStr = dateKey(y, m, d);
      var hasLog = anyLogOnDate(dStr);
      var isToday = dStr === todayStrVal;
      var isSelected = dStr === historyFilterDate;
      var marker = isToday ? '<span class="hcd-hoy">HOY</span>' : '<span class="hcd-dot' + (hasLog ? ' show' : '') + '"></span>';
      var wdHtml = showWd ? '<span class="hcd-wd">' + WD_LETTERS[dateObj.getDay()] + '</span>' : '';
      return '<button type="button" class="hist-cal-day' +
        (hasLog ? ' has-log' : '') + (isToday ? ' today' : '') + (isSelected ? ' selected' : '') +
        '" data-date="' + dStr + '">' + wdHtml + '<span class="hcd-num">' + d + '</span>' + marker + '</button>';
    }

    if(historyCalExpanded){
      var year = historyCalRef.getFullYear();
      var month = historyCalRef.getMonth();
      titleLabel = historyCalRef.toLocaleDateString("es-ES", { month:"long", year:"numeric" });
      titleLabel = titleLabel.charAt(0).toUpperCase() + titleLabel.slice(1);

      var firstOfMonth = new Date(year, month, 1);
      var startOffset = (firstOfMonth.getDay() + 6) % 7; // lunes=0
      var daysInMonth = new Date(year, month + 1, 0).getDate();

      for(var i=0; i<startOffset; i++){
        cells += '<div class="hist-cal-day empty"></div>';
      }
      for(var d=1; d<=daysInMonth; d++){
        cells += dayCellHtml(new Date(year, month, d), false);
      }
    } else {
      var monday = mondayOf(historyCalRef);
      var sunday = new Date(monday); sunday.setDate(sunday.getDate() + 6);
      var monthLabel = sunday.toLocaleDateString("es-ES", { month:"long" });
      monthLabel = monthLabel.charAt(0).toUpperCase() + monthLabel.slice(1);
      titleLabel = monday.getDate() + ' – ' + sunday.getDate() + ' ' + monthLabel +
        '<span class="hist-cal-title-year">' + sunday.getFullYear() + '</span>';
      weekNumLabel = "Semana " + isoWeekNumber(monday);
      for(var w=0; w<7; w++){
        var dayObj = new Date(monday); dayObj.setDate(monday.getDate() + w);
        cells += dayCellHtml(dayObj, true);
      }
    }

    wrap.innerHTML =
      '<div class="hist-cal">' +
        '<div class="hist-cal-header">' +
          '<div class="hist-cal-title-group">' +
            '<span class="hist-cal-title">' + titleLabel + '</span>' +
            (weekNumLabel ? '<span class="hist-cal-week-num">' + weekNumLabel + '</span>' : '') +
          '</div>' +
          '<div class="hist-cal-nav">' +

  function computeHistoryStats(){
    var today = new Date();
    var monday = mondayOf(today);
    var trainedThisWeek = 0;
    for(var i = 0; i < 7; i++){
      var d = new Date(monday); d.setDate(monday.getDate() + i);
      if(anyLogOnDate(dateKey(d.getFullYear(), d.getMonth(), d.getDate()))) trainedThisWeek++;
    }

    var trainedToday = anyLogOnDate(todayStr());

    // Racha: semanas consecutivas con al menos una sesión (nadie entrena los 7 días,
    // así que una racha diaria se rompe casi siempre; por semanas es más realista).
    // Si esta semana todavía no se ha entrenado, no la damos por perdida hasta que
    // termine: empezamos a contar desde la semana anterior.
    function weekHasLog(mondayDate){
      for(var i = 0; i < 7; i++){
        var d = new Date(mondayDate); d.setDate(mondayDate.getDate() + i);
        if(anyLogOnDate(dateKey(d.getFullYear(), d.getMonth(), d.getDate()))) return true;
      }
      return false;
    }
    var weekStreak = 0;
    var wCursor = new Date(monday);
    if(trainedThisWeek === 0) wCursor.setDate(wCursor.getDate() - 7);
    while(weekHasLog(wCursor)){
      weekStreak++;
      wCursor.setDate(wCursor.getDate() - 7);
    }

    // Última fecha con alguna sesión registrada, mirando todo el historial
    var lastDate = null;
    Object.keys(logs).forEach(function(exId){
      (logs[exId] || []).forEach(function(s){
        if(!lastDate || s.date > lastDate) lastDate = s.date;
      });
    });
    var daysSinceLast = null;
    if(lastDate){
      var parts = lastDate.split("-").map(Number);
      var ld = new Date(parts[0], parts[1] - 1, parts[2]); ld.setHours(0,0,0,0);
      var t0 = new Date(); t0.setHours(0,0,0,0);
      daysSinceLast = Math.round((t0 - ld) / 86400000);
    }

    return { trainedThisWeek: trainedThisWeek, weekStreak: weekStreak, trainedToday: trainedToday, lastDate: lastDate, daysSinceLast: daysSinceLast };
  }

    wrap.innerHTML =

          '<div class="hm-icon-box">' + CALENDAR_ICON_SVG + '</div>' +

  function renderMascot(stats){
    var wrap = document.getElementById("historyMascot");
    if(!wrap) return;

    var mood, message;
    if(!stats.lastDate){
      mood = "happy";
      message = "¡Hola! Soy Buddy 🐻 Registra tu primer entreno y empezamos juntos.";
    } else if(stats.trainedToday){
      if(stats.weekStreak >= 2){
        mood = "victory";
        message = "¡" + stats.weekStreak + " semanas seguidas entrenando! Menuda racha, sigue así.";
      } else {
        mood = "gym";
        message = "¡Entreno de hoy registrado! Buen trabajo.";
      }
    } else if(stats.daysSinceLast <= 1){
      mood = "happy";
      message = "Ayer entrenaste. ¿Vamos a por el de hoy?";
    } else if(stats.daysSinceLast <= 3){
      mood = "gym";
      message = "Llevas " + stats.daysSinceLast + " días de descanso. ¿Entrenamos hoy?";
    } else {
      mood = "tired";
      message = "Te echo de menos... ¡" + stats.daysSinceLast + " días sin entrenar!";
    }

    wrap.innerHTML =
      '<section class="buddy-card">' +
        '<div class="buddy-decor"></div>' +
        '<div class="buddy-row">' +
          '<div class="buddy-avatar-wrap">' +

  function sessionDateLabel(dateStr){
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    var weekday = d.toLocaleDateString("es-ES", { weekday: "long" });
    weekday = weekday.charAt(0).toUpperCase() + weekday.slice(1);
    return weekday + " " + parts[2] + " de " + d.toLocaleDateString("es-ES", { month: "long" });
  }

  function replicateSession(date, entries){
    var today = todayStr();
    if(date === today){ alert("Esta sesión ya es de hoy."); return; }
    if(!confirm("¿Copiar los ejercicios y series de ese día al registro de hoy?")) return;
    entries.forEach(function(entry){
      if(!logs[entry.exId]) logs[entry.exId] = [];
      var copiedSets = entry.sets.map(function(s){ return { weight: s.weight, reps: s.reps }; });
      var existing = logs[entry.exId].filter(function(s){ return s.date === today; })[0];
      if(existing){
        existing.sets = existing.sets.concat(copiedSets);
      } else {
        logs[entry.exId].push({ date: today, sets: copiedSets, notes: "" });
      }
    });
    saveJSON(STORAGE_KEY, logs);
    renderHistory();
    renderGreetingBlock();
    renderExercises();
    goToView("hoy");
  }

  function renderHistory(){
    var stats = computeHistoryStats();
    renderMascot(stats);
    renderHistoryStats(stats);
    renderHistoryCalendar();

    var container = document.getElementById("historyContainer");
    container.innerHTML = "";

    var exFlat = allExercisesFlat();
    var allEntries = [];
    Object.keys(logs).forEach(function(exId){
      var exInfo = exFlat.filter(function(e){ return e.id === exId; })[0];
      logs[exId].forEach(function(session, idx){
        allEntries.push({
          exId: exId,
          exName: exInfo ? exInfo.name : exId,
          group: exInfo ? exInfo.group : "otros",
          date: session.date,
          sets: session.sets,
          notes: session.notes,
          idx: idx
        });
      });
    });

    if(historyFilterDate){
      allEntries = allEntries.filter(function(e){ return e.date === historyFilterDate; });
    }

    if(allEntries.length === 0){
      if(historyFilterDate){
        container.innerHTML = '<div class="empty"><div class="big">🗒️</div>No hay registros para ese día.</div>';
      } else {
        container.innerHTML = '<div class="empty"><div class="big">🗒️</div>' +
          'Aún no has registrado ninguna sesión.' +
          '<button type="button" class="btn primary empty-cta" id="emptyGoEntreno">Empezar a entrenar hoy →</button>' +
          '</div>';
        var ctaBtn = document.getElementById("emptyGoEntreno");
        if(ctaBtn) ctaBtn.addEventListener("click", function(){ goToView("hoy"); });
      }
      return;
    }

    allEntries.sort(function(a,b){ return b.date.localeCompare(a.date); });

    if(historyFilterDate){
      var totalSets = allEntries.reduce(function(sum, e){ return sum + e.sets.length; }, 0);
      var summaryDiv = document.createElement("div");
      summaryDiv.className = "hist-day-summary";
      summaryDiv.textContent = allEntries.length + (allEntries.length === 1 ? " ejercicio · " : " ejercicios · ") +
        totalSets + (totalSets === 1 ? " serie registrada" : " series registradas");
      container.appendChild(summaryDiv);
    }

    // Agrupar por fecha en "sesiones"
    var dates = [];
    var byDate = {};
    allEntries.forEach(function(entry){
      if(!byDate[entry.date]){ byDate[entry.date] = []; dates.push(entry.date); }
      byDate[entry.date].push(entry);
    });

    dates.forEach(function(date){
      var entries = byDate[date];
      var totalKg = 0;
      entries.forEach(function(e){
        e.sets.forEach(function(s){ totalKg += (Number(s.weight) || 0) * (Number(s.reps) || 0); });
      });

      var sessionDiv = document.createElement("div");
      sessionDiv.className = "hist-session";

      var headerHtml =
        '<div class="hist-session-head">' +
          '<div class="hsh-left">' +
            '<span class="hsh-dot"></span>' +
            '<div>' +
              '<div class="hsh-title">SESIÓN REGISTRADA: ' + sessionDateLabel(date).toUpperCase() + '</div>' +
              '<div class="hsh-sub">' + entries.length + (entries.length === 1 ? " ejercicio" : " ejercicios") +
                (totalKg > 0 ? " · " + Math.round(totalKg) + " kg totales" : "") + '</div>' +
            '</div>' +
          '</div>' +
          '<button type="button" class="hsh-toggle" title="Mostrar/ocultar ejercicios" aria-expanded="true">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>' +
          '</button>' +
        '</div>';

      var cardsHtml = "";
      entries.forEach(function(entry){
        var weights = entry.sets.map(function(s){ return Number(s.weight) || 0; });
        var maxWeight = 0, hasWeight = false;
        weights.forEach(function(w){ if(w > 0){ hasWeight = true; if(w > maxWeight) maxWeight = w; } });
        var distinctWeights = weights.filter(function(v, i){ return weights.indexOf(v) === i; });
        var hasProgression = hasWeight && distinctWeights.length > 1;
        var prIdx = -1;
        if(hasProgression){
          for(var wi = weights.length - 1; wi >= 0; wi--){ if(weights[wi] === maxWeight){ prIdx = wi; break; } }
        }
        var badgeHtml = hasWeight
          ? '<span class="hist-pr-badge">Top: ' + maxWeight + 'kg</span>'
          : '<span class="hist-pr-badge plain">' + entry.sets.length + (entry.sets.length === 1 ? " serie" : " series") + '</span>';
        var chipsHtml = entry.sets.map(function(s, i){
          var isPr = i === prIdx;
          return '<span class="hist-set-chip' + (isPr ? ' pr' : '') + '">' +
            '<span class="chip-tag">' + (isPr ? "PR" : ("S" + (i + 1))) + '</span>' +
            s.weight + 'kg × ' + s.reps + '</span>';
        }).join("");
        var notesHtml = entry.notes ? '<div class="notes-preview">"' + escapeHtml(entry.notes) + '"</div>' : '';

        cardsHtml +=
          '<div class="hist-ex-card" data-exid="' + entry.exId + '" data-idx="' + entry.idx + '">' +
            '<div class="hist-ex-top">' +
              '<div class="hist-ex-info">' +
                '<div class="hist-ex-meta">' + groupBadgeHtml(entry.group) +
                  '<span class="hist-ex-date">' + entry.date + '</span></div>' +
                '<div class="hist-ex-name">' + escapeHtml(entry.exName) + '</div>' +
              '</div>' +
              '<button class="ex-menu-btn hist-ex-menu-btn" title="Opciones">⋮</button>' +
            '</div>' +
            '<div class="hist-ex-divider"></div>' +
            '<div class="hist-ex-bottom">' +
              '<div class="hist-set-chips">' + chipsHtml + '</div>' +
              badgeHtml +
            '</div>' +
            notesHtml +
            '<div class="ex-menu hidden hist-ex-menu">' +
              '<button class="ex-menu-item delete danger">🗑 Eliminar registro</button>' +
            '</div>' +
          '</div>';
      });

      sessionDiv.innerHTML = headerHtml +
        '<div class="hist-ex-list">' + cardsHtml + '</div>' +
        '<button type="button" class="btn hist-replicate-btn">↻ Replicar este entrenamiento hoy</button>';

      sessionDiv.querySelector(".hsh-toggle").addEventListener("click", function(){
        var collapsed = sessionDiv.classList.toggle("collapsed");
        this.setAttribute("aria-expanded", collapsed ? "false" : "true");
      });

      sessionDiv.querySelectorAll(".hist-ex-card").forEach(function(card){
        var exId = card.getAttribute("data-exid");
        var idx = Number(card.getAttribute("data-idx"));
        var menuBtn = card.querySelector(".hist-ex-menu-btn");
        var menu = card.querySelector(".hist-ex-menu");
        menuBtn.addEventListener("click", function(ev){
          ev.stopPropagation();
          document.querySelectorAll(".ex-menu").forEach(function(m){ if(m !== menu) m.classList.add("hidden"); });
          menu.classList.toggle("hidden");
        });
        menu.querySelector(".delete").addEventListener("click", function(){
          menu.classList.add("hidden");
          if(confirm("¿Eliminar este registro?")){
            logs[exId].splice(idx, 1);
            saveJSON(STORAGE_KEY, logs);
            renderHistory();
            renderGreetingBlock();
          }
        });
      });

      sessionDiv.querySelector(".hist-replicate-btn").addEventListener("click", function(){
        replicateSession(date, entries);
      });

      container.appendChild(sessionDiv);
    });
  }
